# timeout-patch.cfg — Set UEFI boot timeout to 0
#
# Apply to: Silicon/NVIDIA/NVIDIA.common.dsc.inc
# Find the PcdPlatformBootTimeOut line and set value to 0:
#
# Before:
#   gEfiMdePkgTokenSpaceGuid.PcdPlatformBootTimeOut|L"Timeout"|gEfiGlobalVariableGuid|0x0|5
#
# After:
#   gEfiMdePkgTokenSpaceGuid.PcdPlatformBootTimeOut|L"Timeout"|gEfiGlobalVariableGuid|0x0|0
#
# sed command:
#   sed -i 's/PcdPlatformBootTimeOut|L"Timeout"|gEfiGlobalVariableGuid|0x0|[0-9]*/PcdPlatformBootTimeOut|L"Timeout"|gEfiGlobalVariableGuid|0x0|0/' \
#     Silicon/NVIDIA/NVIDIA.common.dsc.inc

PcdPlatformBootTimeOut=0
